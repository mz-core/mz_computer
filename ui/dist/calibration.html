<!doctype html>
<html lang="pt-BR"><meta charset="utf-8"><title>Calibrar tela · MZ OS</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#123859;color:#fff;font:24px Arial,sans-serif}
body{border:8px solid #59e3cc;background-image:linear-gradient(#ffffff20 1px,transparent 1px),linear-gradient(90deg,#ffffff20 1px,transparent 1px);background-size:10% 10%;display:grid;place-items:center}
main{text-align:center;padding:30px;background:#10283fec;border:1px solid #ffffff50;border-radius:18px}h1{font-size:56px;margin:0 0 14px}p{margin:10px}.corner{position:absolute;padding:14px;font-weight:bold}.tl{top:10px;left:10px}.tr{top:10px;right:10px}.bl{bottom:10px;left:10px}.br{bottom:10px;right:10px}
</style>
<body><span class="corner tl">1 · SUPERIOR ESQUERDO</span><span class="corner tr">2 · SUPERIOR DIREITO</span>
<main><h1>MZ OS</h1><p>Prévia da tela</p><p>Encaixe a borda verde no vidro do monitor.</p><p>ENTER simula em 1ª pessoa · G ajusta · R remarca</p></main>
<span class="corner bl">3 · INFERIOR ESQUERDO</span><span class="corner br">INFERIOR DIREITO</span>
<script>
const id=new URLSearchParams(location.search).get('surface');
const resource=typeof GetParentResourceName==='function'?GetParentResourceName():'mz_computer';
const callback=name=>fetch(`https://${resource}/${name}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id})}).catch(()=>{});
addEventListener('message',event=>{if(event.data?.type==='computer:open')requestAnimationFrame(()=>requestAnimationFrame(()=>callback('surfaceVisible')))});
if(id)callback('surfaceReady');
</script></body></html>
